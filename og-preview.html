<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #09090b;
    --surface: #18181b;
    --border:  #27272a;
    --orange:  #fb923c;
    --text:    #fafafa;
    --muted:   #71717a;
  }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ambient background */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(251,146,60,.14) 0%, transparent 62%),
      radial-gradient(ellipse 45% 40% at 78% 82%, rgba(251,146,60,.05) 0%, transparent 55%),
      var(--bg);
  }
  /* faint grid to give texture */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 0%, transparent 75%);
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
    padding: 0 60px;
  }

  .icon {
    width: 148px;
    height: 148px;
    filter: drop-shadow(0 6px 40px rgba(251,146,60,.4));
  }

  h1 {
    font-size: 78px;
    font-weight: 700;
    color: var(--orange);
    letter-spacing: -0.03em;
    line-height: 1;
    text-shadow: 0 0 70px rgba(251,146,60,.3);
  }

  .sub {
    font-size: 30px;
    color: #a1a1aa;
    font-weight: 400;
    letter-spacing: 0.005em;
  }

  .pills {
    display: flex;
    gap: 14px;
    margin-top: 10px;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .pill svg { display: block; }
  .pill .dot { color: var(--orange); }

  .url {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="bg"></div>

  <div class="card">
    <!-- crisp inline pumpkin -->
    <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- stem -->
      <path d="M32 15c0-4 1.5-7 4-8.5-.5 3 .5 5 .5 7.5 0 2-1.5 3.5-4.5 3.5" fill="#4d7c3a"/>
      <path d="M32 15c0-3.5-1.2-6.2-3.4-7.8.6 2.8-.4 4.8-.4 7.3 0 1.9 1.5 3.2 3.8 3.2" fill="#3f6a30"/>
      <!-- body lobes -->
      <ellipse cx="20" cy="38" rx="12" ry="18" fill="#ea7a1e"/>
      <ellipse cx="44" cy="38" rx="12" ry="18" fill="#ea7a1e"/>
      <ellipse cx="26" cy="37" rx="11" ry="19" fill="#f5943a"/>
      <ellipse cx="38" cy="37" rx="11" ry="19" fill="#f5943a"/>
      <ellipse cx="32" cy="37" rx="13" ry="20" fill="#fb923c"/>
      <!-- highlight -->
      <ellipse cx="27" cy="26" rx="4.5" ry="7" fill="#ffb268" opacity="0.6"/>
      <!-- carved face -->
      <path d="M23 33l6 3.5-6 1.5z" fill="#1a1206"/>
      <path d="M41 33l-6 3.5 6 1.5z" fill="#1a1206"/>
      <path d="M23 44c2-2.5 5-3.5 9-3.5s7 1 9 3.5c-2.2-1-4.5-1.4-4.5-1.4l-1.5 2-2-2-2 2-2-2s-2.3.4-4.5 1.4z" fill="#1a1206"/>
    </svg>

    <h1>PumpkinQuest</h1>
    <p class="sub">Инструменты и материалы для НРИ</p>

    <div class="pills">
      <div class="pill">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Инструменты
      </div>
      <div class="pill">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        LSS
      </div>
    </div>
  </div>

  <div class="url">pumpkin.quest</div>
</body>
</html>
